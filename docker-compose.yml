services:
  tieba-sign:
    build: .
    image: tieba-auto-sign:latest
    container_name: tieba-auto-sign
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - RUN_AT=${RUN_AT:-02:30}
      - RUN_ON_START=${RUN_ON_START:-0}
      - TIEBA_LOG_FILE=/app/logs/tieba_sign.log
    volumes:
      - ./logs:/app/logs
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
